# Production deploy: copy to .github/workflows/deploy.yml and replace
#   <app>          short app name (concurrency groups, image names)
#   <project>      registry project that holds the images
#   <namespace>    Kubernetes namespace
#   <prod-branch>  the branch that deploys to production
#   <runner-label>   runner label for the jobs that need registry or cluster credentials (build and deploy only)
#   <kubectl-version> <kubectl-sha256>   record both once from dl.k8s.io
#   FACILITRA_CI_SHA   40-hex commit of a Facilitra/ci release (Dependabot keeps it current)
# The registry host comes from a repository or organisation variable, for example
# registry.example.com. Keep the job graph, the needs and the timeouts as they are.
name: Deploy Production

on:
  push:
    branches: [<prod-branch>]
    paths-ignore: ['*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.guard.outputs.ref }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - id: guard
        uses: Facilitra/ci/actions/deploy-guard@FACILITRA_CI_SHA # v1.0.0
        with:
          branches: <prod-branch>

  quality:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/gate

  audit:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: Facilitra/ci/actions/osv-scan@FACILITRA_CI_SHA # v1.0.0

  build:
    needs: [guard, quality, audit]
    runs-on: <runner-label>
    timeout-minutes: 45
    environment: production
    concurrency:
      group: build-<app>-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: Facilitra/ci/actions/harbor-build@FACILITRA_CI_SHA # v1.0.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          tag: ${{ needs.guard.outputs.tag }}
          revision: ${{ needs.guard.outputs.ref }}
          floating-tag: latest
          images: |
            <project>/<app>
            <project>/<app>-migrate
          # BuildKit secret instead of a build-arg, when the build needs one:
          # build-secret-id: example_key
          # build-secret-value: ${{ secrets.EXAMPLE_KEY }}

  deploy:
    needs: [guard, build]
    runs-on: <runner-label>
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-<app>-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false
      - uses: Facilitra/ci/actions/k8s-setup@FACILITRA_CI_SHA # v1.0.0
        with:
          kubectl-version: <kubectl-version>
          kubectl-sha256: <kubectl-sha256>
      - uses: Facilitra/ci/actions/k8s-pin@FACILITRA_CI_SHA # v1.0.0
        with:
          files: |
            k8s/app
            k8s/jobs
          images: |
            <project>/<app>
            <project>/<app>-migrate
          from: latest
          to: ${{ needs.guard.outputs.tag }}

      # Apply order: infrastructure, database wait, migration Job, app Deployments.
      - uses: Facilitra/ci/actions/k8s-apply@FACILITRA_CI_SHA # v1.0.0
        with:
          paths: |
            k8s/app
          exclude: |
            k8s/app/deployment.yaml
      - name: Wait for the database
        run: kubectl rollout status deployment/<app>-db -n <namespace> --timeout=180s
      - uses: Facilitra/ci/actions/k8s-job@FACILITRA_CI_SHA # v1.0.0
        with:
          namespace: <namespace>
          manifest: k8s/jobs/migrate.yaml
          name: <app>-migrate
      - uses: Facilitra/ci/actions/k8s-apply@FACILITRA_CI_SHA # v1.0.0
        with:
          paths: |
            k8s/app/deployment.yaml
      - uses: Facilitra/ci/actions/k8s-rollout@FACILITRA_CI_SHA # v1.0.0
        with:
          namespace: <namespace>
      - name: Post-deploy checks
        run: bash scripts/ci/post-deploy.sh
