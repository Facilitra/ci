apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multi-data
  namespace: example-multi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi
  namespace: example-multi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi
  template:
    metadata:
      labels:
        app: multi
    spec:
      initContainers:
        - name: migrate
          image: registry.example.com/example/multi:latest
          command: ["./migrate"]
      containers:
        - name: multi
          image: registry.example.com/example/multi:latest
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: multi-data
