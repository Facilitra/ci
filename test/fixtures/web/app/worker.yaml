apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-worker
  namespace: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-worker
  template:
    metadata:
      labels:
        app: web-worker
    spec:
      containers:
        - name: worker
          image: reg.example.com/example/web-worker:latest
          imagePullPolicy: Always
          command: ["./worker"]
