apiVersion: v1
kind: Service
metadata:
  name: api-db
  namespace: example-api
spec:
  clusterIP: None
  selector:
    app: api-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: api-db
  namespace: example-api
spec:
  serviceName: api-db
  replicas: 1
  selector:
    matchLabels:
      app: api-db
  template:
    metadata:
      labels:
        app: api-db
    spec:
      containers:
        - name: db
          image: registry.example.com/mirror/db:1.0
          ports:
            - containerPort: 5432
