apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: example-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.example.com/example/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
